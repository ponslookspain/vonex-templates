sections:
  - title: About Softic Studio
    paragraphs:
      - Softic Studio is a free design agency template for Framer, made for creative studios, branding agencies and freelancers. Its dark look and bold type present your work with confidence.
      - Show projects, services and your team on a site built to win clients, then add new case studies in the CMS as your studio grows.
  - title: Why Softic Studio
  - title: Built for creative businesses
    paragraphs:
      - Made for studios, agencies and creative teams that need a professional home for their work.
  - title: Case studies in the CMS
    paragraphs:
      - Show projects, visuals and results on CMS-powered Work pages that are easy to manage.
  - title: Your team on the page
    paragraphs:
      - A CMS Team section introduces the people behind the work.
  - title: Smooth by default
    paragraphs:
      - Scroll animations, subtle hover effects and clean navigation keep the site feeling polished.
  - title: Features
    items:
      - Responsive on desktop, tablet and phone
      - Dark, large-type design
      - Portfolio showcase pages
      - CMS Projects
      - CMS Team
      - Sticky scrolling and scroll effects
      - Appear and text effects
      - Contact form with notifications
  - title: Pages Included
    items:
      - Home
      - About
      - Works
      - Project (CMS)
      - Contact
      - Privacy Policy
      - "404"
  - title: Best For
    items:
      - Design agencies
      - Creative studios
      - Branding agencies
      - Boutique agencies
      - UI/UX designers
      - Freelancers
  - title: Good to Know
    paragraphs:
      - Replace the sample case studies, services and team profiles with your own, and test the contact form before you publish.
  - title: Updates
  - title: v1.2 Hero Refresh
    items:
      - Redesigned Hero section
      - Improved visual hierarchy and first screen
      - Minor UI refinements across the template
      - Better spacing and consistency
  - title: Support
    paragraphs:
      - If you have questions about using or customizing the template, write to [ponslookdesign@gmail.com](mailto:ponslookdesign@gmail.com) or [X](https://x.com/ponslookdesign).
