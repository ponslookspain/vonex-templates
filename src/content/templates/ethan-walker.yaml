sections:
  - title: Walker — Framer Portfolio Template for Creative Professionals
    paragraphs:
      - Walker is a premium Framer portfolio template for designers, freelancers, creative professionals, and digital creators who want to showcase their work with a clean, modern, and timeless website.
  - title: About
    paragraphs:
      - Walker combines bold typography, spacious layouts, smooth interactions, and a refined minimalist aesthetic to create a portfolio that keeps the focus on your work. Whether you're building a personal brand or presenting client projects, Walker helps you launch a professional website in Framer without writing code.
  - title: Why Walker
  - title: Designed for Creative Professionals
    paragraphs:
      - Perfect for UI/UX designers, graphic designers, freelancers, creative developers, photographers, and digital creatives looking for a polished online portfolio.
  - title: CMS-Powered Portfolio
    paragraphs:
      - Manage projects effortlessly with Framer CMS and update your portfolio without editing the design.
  - title: Minimal Design with Strong Visual Hierarchy
    paragraphs:
      - Clean layouts, large typography, generous spacing, and subtle animations create a premium browsing experience.
  - title: Fast & SEO Ready
    paragraphs:
      - Built with responsive layouts, optimized performance, semantic structure, and SEO best practices.
