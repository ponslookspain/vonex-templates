sections:
  - title: About Ethan Walker
    paragraphs:
      - Ethan Walker is a free portfolio template for Framer, made for designers, freelancers and creative developers. Large type and open layouts keep the focus on your projects, not on a long introduction.
      - Add a new case study in the CMS and the design takes care of the rest, so your portfolio can grow without layout work.
  - title: Why Ethan Walker
  - title: Your work comes first
    paragraphs:
      - Bold typography, generous spacing and a clear hierarchy guide visitors straight to your projects.
  - title: Projects in the CMS
    paragraphs:
      - Manage projects and services in Framer CMS and update your portfolio without editing the design.
  - title: Ready for enquiries
    paragraphs:
      - Work, About and Contact pages come ready, with a contact form for new clients.
  - title: Subtle motion
    paragraphs:
      - Smooth animations and hover interactions add polish without getting in the way of your work.
  - title: Features
    items:
      - Responsive on desktop, tablet and phone
      - CMS Projects
      - CMS Services
      - CMS Privacy Policy
      - Large typographic layouts
      - Appear, scroll and text effects
      - Hover interactions
      - Contact form
  - title: Pages Included
    items:
      - Home
      - About
      - Work
      - Project (CMS)
      - Contact
      - Privacy Policy (CMS)
      - "404"
  - title: Best For
    items:
      - UI/UX designers
      - Graphic designers
      - Freelancers
      - Creative developers
      - Personal brand websites
      - Design portfolios
  - title: Good to Know
    paragraphs:
      - Replace the sample projects, services and privacy text with your own. Check that your Framer plan covers the CMS collections before you publish.
  - title: Support
    paragraphs:
      - If you have questions about using or customizing the template, write to [ponslookdesign@gmail.com](mailto:ponslookdesign@gmail.com) or [X](https://x.com/ponslookdesign).
