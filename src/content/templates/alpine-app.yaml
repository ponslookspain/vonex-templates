sections:
  - title: About Alpine App
    paragraphs:
      - Alpine App is a free mobile app landing page template for Framer. Black-on-white type, square corners and hairline grids give your app a precise, technical launch page.
      - Your app sits on a phone below an oversized headline. Swap the screenshot or drop in an MP4 screen recording from the right panel, with no digging through layers.
  - title: Why Alpine App
  - title: Built for app launches
    paragraphs:
      - Store buttons, a QR code, ratings and a Free/Pro pricing table with a monthly/yearly switch are ready to use.
  - title: Store-ready pages
    paragraphs:
      - App Store and Google Play ask for a support URL and a privacy policy. Alpine App includes a Support page with a native form and a Legal page with Privacy Policy and Terms.
  - title: Edit everything from properties
    paragraphs:
      - Every text, link, image and alt text is a component property. Colors and fonts are global styles, so a rebrand takes minutes.
  - title: Ready for search
    paragraphs:
      - One H1 per page, clean heading order, meta titles and descriptions, an Open Graph image and a favicon are set.
  - title: Features
    items:
      - Responsive on desktop, tablet and phone
      - Phone mockup with image or video screen
      - Scroll-pinned feature blocks
      - Ticker, appear and hover animations
      - Monthly/yearly pricing switch
      - FAQ accordion
      - Native Framer contact form
      - Mobile menu
      - 16 editable section components
      - Global color and text styles
      - Royalty-free fonts, icons and photos
  - title: Pages Included
    items:
      - Home
      - Support
      - Legal (Privacy Policy, Terms of Use)
      - "404"
  - title: Best For
    items:
      - Mobile app landing pages
      - App launches and waitlists
      - Fitness, outdoor and sports apps
      - Productivity and utility apps
      - Indie developers and startups
  - title: Good to Know
    paragraphs:
      - Replace the sample app details, store links and pricing with your own. The Privacy Policy and Terms are examples, so check them against your app before you publish.
  - title: Support
    paragraphs:
      - If you have questions about using or customizing the template, write to [ponslookdesign@gmail.com](mailto:ponslookdesign@gmail.com) or [X](https://x.com/ponslookdesign).
