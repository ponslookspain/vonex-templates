sections:
  - title: About Fallow
    paragraphs:
      - Fallow is a free therapist website template for Framer, made for counselors, psychologists and small private practices. Its warm, editorial look is calm on purpose, so an anxious visitor finds what they need fast.
      - Format, session length and fees sit up front. A full-screen photo hero and a large serif headline set the tone, then the site walks people through how to start.
  - title: Why Fallow
  - title: Made for private practice
    paragraphs:
      - A Fees page with a sliding scale and superbill example, a free first call, booking openings from the CMS and a crisis note in the footer.
  - title: Built to be edited
    paragraphs:
      - Every section is a component. Colors and fonts are global styles, and a Start Here page explains each step.
  - title: Not the usual therapy site
    paragraphs:
      - A scroll-driven seasons section, a topic picker that rotates on its own, and a hero photo of a person, not a stock smile.
  - title: Ready for search
    paragraphs:
      - One H1 per page, clean heading order, meta titles and descriptions, a social preview image and favicons on every page.
  - title: Features
    items:
      - Responsive on desktop, tablet and phone
      - Seasons section that pins and changes as you scroll
      - Topic picker with a progress bar
      - Services list with hover photos
      - CMS Journal with post pages
      - CMS list of next openings
      - Contact form and booking link
      - FAQ accordion and mobile menu
      - Global color and text styles
  - title: Pages Included
    items:
      - Home
      - About
      - Services
      - Fees
      - Journal (with post pages)
      - Contact and 404
  - title: Best For
    items:
      - Therapists
      - Psychologists
      - Counselors
      - Coaches
      - Small wellness practices
  - title: Good to Know
    paragraphs:
      - The sample photos are generated for the demo, so replace them with your own. Replace the practice details and crisis number too, and check local rules on testimonials and advertising. Some animation uses a small code file (Motion.tsx); the layers stay editable.
  - title: Support
    paragraphs:
      - If you have questions about using or customizing the template, write to [ponslookdesign@gmail.com](mailto:ponslookdesign@gmail.com) or [X](https://x.com/ponslookdesign).
