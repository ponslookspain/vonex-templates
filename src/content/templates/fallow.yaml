sections:
  - title: About Fallow
    paragraphs:
      - "Fallow is a free Framer website template for therapists, counselors and small private practices. It has a warm, editorial look: a full-screen photo hero, a large serif headline with one italic word, and clear facts up front (format, session length, fees). It is calm on purpose, so a visitor who is anxious or in a hurry finds what they need fast."
  - title: Why Fallow
    paragraphs:
      - Features
    items:
      - "Made for practices: Fees page with a sliding scale and superbill example, a free first call, booking openings from the CMS, and a crisis note in the footer."
      - "Built to be edited: Every section is a component. Colors and fonts are global styles, so rebranding takes minutes. A “Start here” page explains each step."
      - "Not the usual look: A scroll-driven seasons section, an interactive topic picker that rotates on its own, and a hero photo of a person, not a stock smile."
      - "SEO ready: One H1 per page, clean heading order, meta titles and descriptions, a social preview image and favicons for every page."
      - Responsive on desktop, tablet and phone
      - Seasons section that pins and changes color and text as you scroll
      - Topic picker with a progress bar, services list with hover photos
      - CMS Journal with post pages, and a CMS list of next openings
      - Contact form, booking link, FAQ accordion and mobile menu
      - Native animations plus a small code file (Motion.tsx), with the layers fully editable
      - Global color and text styles, components in folders
  - title: "Pages included:"
    items:
      - Home
      - About
      - Services
      - Fees
      - Journal (with post pages)
      - Contact and 404
  - title: "Best for:"
    paragraphs:
      - "Good to know: The sample photos are generated for the demo. Replace them with your own before you publish."
    items:
      - Therapists
      - psychologists
      - counselors
      - coaches
      - small wellness practices and anyone building a site for them.
  - title: "Support:"
    paragraphs:
      - If you have any questions about using or customizing the template, feel free to reach out via [ponslookdesign@gmail.com](mailto:ponslookdesign@gmail.com) or [X](https://x.com/ponslookdesign).
