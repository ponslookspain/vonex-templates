sections:
  - title: Harrier — Framer Template for AI & SaaS Products
    paragraphs:
      - Harrier is a premium Framer template for AI startups, SaaS products, automation tools, and agent platforms that want to earn trust with a calm, editorial website instead of loud gradients.
  - title: About
    paragraphs:
      - Harrier combines serif-led typography, a warm paper palette, native interface illustrations, and smooth animations to present your product clearly and confidently. An animated agent window in the hero, an interactive testimonial switcher, and a built-in blog and changelog help you launch a complete product website in Framer without writing code.
  - title: Why Harrier
    paragraphs:
      - Designed for AI & SaaS Products
      - Perfect for AI agents, automation tools, B2B SaaS, developer tools, and startups that need a credible launch site.
      - CMS-Powered Blog & Changelog
      - Publish articles and release notes with Framer CMS. Detail pages and SEO fill in automatically.
      - Editorial Design with Strong Visual Hierarchy
      - Serif headings, generous spacing, one accent color, and illustrations built from native layers keep the focus on your product.
      - Easy to Customize & SEO Ready
