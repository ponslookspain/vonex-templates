sections:
  - title: About Harrier
    paragraphs:
      - Harrier is a free AI and SaaS website template for Framer, made for startups, automation tools and agent platforms. It earns trust with a calm, editorial look instead of loud gradients.
      - Serif headlines, a warm paper palette and native interface illustrations present your product clearly. An animated agent window opens the page, and a blog and changelog keep your site current after launch.
  - title: Why Harrier
  - title: A full product website
    paragraphs:
      - Features, Pricing, About, Blog, Changelog and Contact pages are included, so you can launch more than a single landing page.
  - title: Blog and changelog in the CMS
    paragraphs:
      - Publish articles and release notes with Framer CMS. Detail pages and their SEO fields fill in automatically.
  - title: Clear pricing
    paragraphs:
      - A plan comparison table helps visitors see what each plan includes.
  - title: Easy setup
    paragraphs:
      - Global color and text styles make rebranding simple, and a Start Here guide walks you through the template.
  - title: Features
    items:
      - Responsive on desktop, tablet and phone
      - Animated hero with agent window and floating cards
      - Auto-advancing testimonial switcher
      - Bento features with native UI illustrations
      - CMS Blog
      - CMS Changelog
      - Pricing with plan comparison table
      - FAQ accordion
      - Scroll and text reveal animations
      - Contact form
      - Global color and text styles
      - Start Here setup guide
  - title: Pages Included
    items:
      - Home
      - Features
      - Pricing
      - About
      - Blog
      - Blog Post (CMS)
      - Changelog
      - Changelog Entry (CMS)
      - Contact
      - "404"
  - title: Best For
    items:
      - AI startups
      - SaaS websites
      - AI agent platforms
      - Automation tools
      - B2B software
      - Product launches
  - title: Good to Know
    paragraphs:
      - Replace the sample blog posts, release notes and plan details with your own. Check that your Framer plan covers the CMS collections before you publish.
  - title: Support
    paragraphs:
      - If you have questions about using or customizing the template, write to [ponslookdesign@gmail.com](mailto:ponslookdesign@gmail.com) or [X](https://x.com/ponslookdesign).
