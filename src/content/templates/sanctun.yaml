      - Contact
      - Footer
  - title: Who It’s For
    paragraphs:
      - Sanctun is perfect for couples who want a high-end, elegant wedding website without spending weeks designing or learning code. Ideal for classic, luxury, garden, castle, or destination weddings.
  - title: Why Choose Sanctun?
    paragraphs:
      - Stop wasting time piecing together templates or paying thousands for a custom site. Get a polished, professional wedding website that you can fully customize yourself — in minutes.Refund Policy
      - Due to the digital nature of this product, returns are not accepted.
